version: '3.8'

services:
  # 1. Authoritative PostgreSQL 18 Database
  postgres:
    image: postgres:18-alpine
    container_name: dailysave_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dailysave_db}
      POSTGRES_USER: ${DB_USER:-dailysave_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SuperSecretSecurePasswordChangeMe!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dailysave_app} -d ${DB_NAME:-dailysave_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dailysave_network

  # 2. DailySave Native Node.js Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dailysave_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dailysave_db}
      DB_USER: ${DB_USER:-dailysave_app}
      DB_PASSWORD: ${DB_PASSWORD:-SuperSecretSecurePasswordChangeMe!}
      DB_SSL: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-generate_high_entropy_secret_with_openssl}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-generate_high_entropy_secret_with_openssl_refresh}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://dailysave.et,https://www.dailysave.et}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dailysave_network

  # 3. Nginx HTTPS & Reverse Proxy
  nginx:
    image: nginx:1.27-alpine
    container_name: dailysave_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./build/web:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - dailysave_network

volumes:
  postgres_data:
    driver: local

networks:
  dailysave_network:
    driver: bridge
