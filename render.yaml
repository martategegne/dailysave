# Render Blueprint Infrastructure as Code for DailySave
# Deploys backend web service connected to Neon PostgreSQL
services:
  - type: web
    name: dailysave-api
    runtime: node
    plan: free
    region: frankfurt # Matches Neon Frankfurt region
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/database/migrate.js && node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DB_HOST
        value: ep-flat-leaf-b97rns7t-pooler.c-7.eu-central-1.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: neondb
      - key: DB_USER
        value: neondb_owner
      - key: DB_PASSWORD
        value: npg_ZtG0xwe3oIQB
      - key: DB_SSL
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: "900"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "2592000"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
