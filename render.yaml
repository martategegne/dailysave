# Render Blueprint Infrastructure as Code for DailySave
# Deploy backend web service and PostgreSQL database with zero manual setup
services:
  - type: web
    name: dailysave-api
    runtime: node
    plan: free
    region: frankfurt # Low latency to East Africa / Ethiopia
    rootDir: backend
    buildCommand: npm ci --only=production
    startCommand: node src/database/migrate.js && node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: ALLOWED_ORIGINS
        value: https://app.dailysave.et,https://www.dailysave.et,https://dailysave.pages.dev
      - key: DB_HOST
        fromDatabase:
          name: dailysave-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: dailysave-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: dailysave-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: dailysave-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dailysave-db
          property: password
      - key: DB_SSL
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: "900"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "2592000"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"

databases:
  - name: dailysave-db
    plan: free
    region: frankfurt
    databaseName: dailysave_prod
    user: dailysave_admin
