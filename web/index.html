<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="DailySave — Accessible, secure, offline-first personal financial management application with Ethiopian Birr and Ge'ez calendar support.">
  <meta name="robots" content="noindex, nofollow">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DailySave">
  <meta name="theme-color" content="#16865B">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DailySave — Personal Finance & Savings</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #F7F9F8;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;
      background-color: #F7F9F8;
      transition: opacity 0.3s ease-out;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(22, 134, 91, 0.2);
      border-top-color: #16865B;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .app-title {
      margin-top: 20px;
      font-size: 20px;
      font-weight: 700;
      color: #172554;
      letter-spacing: -0.5px;
    }
    .app-subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: #64748B;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator" aria-label="Loading DailySave application" role="status">
    <div class="spinner"></div>
    <div class="app-title">DailySave (የዕለት ቁጠባ)</div>
    <div class="app-subtitle">Loading secure financial workspace...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 300);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
